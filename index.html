<div class="txt">`+P(`Ants are a crucial part of nature. Among other roles, ants ventilate the soil, spread seeds, break down organic material, create habitat for other animals and form an essential part of the food chain. Estimating ant numbers and mass provides an important baseline for monitoring ant populations amid worrying environmental changes. There are more than 15,700 named species and subspecies of ants, and many others are not yet named by science. Ants’ high degree of social organization has enabled them to colonize nearly all ecosystems and regions around the globe.
