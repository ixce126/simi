<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Maturita – English C1</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1e242d;--line:#2a313c;--tx:#e6e9ee;--mut:#9aa4b2;--ac:#6ea8fe;--ac2:#1d3557;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 92px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 14px 8px}
.hin{max-width:780px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--mut)}
.top b{color:var(--tx);font-size:15px}
.bar{height:5px;background:var(--card2);border-radius:3px;margin:6px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
main{max-width:780px;margin:auto;padding:6px 14px 70px}
h1{font-size:22px;line-height:1.25;margin:18px 0 4px}
h2{font-size:19px;margin:34px 0 4px;color:var(--ac);line-height:1.3}
h3{font-size:18px;margin:6px 0 6px;line-height:1.3}
.sub{color:var(--mut);margin:0 0 10px;font-size:15px}
section{border-top:1px solid var(--line);margin-top:28px;padding-top:14px}
.ins{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0 12px;font-size:15.5px}
.ins p,.txt p,.qb p{margin:0 0 10px}
.txt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.txt p:last-child{margin:0}
.cap{color:var(--mut);font-size:14px;font-style:italic;margin-top:-4px}
.fn{color:var(--mut);font-size:14px}
.q{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.qn{flex:none;min-width:2.1em;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
.qb{flex:1;min-width:0}
.qb>p:last-child{margin-bottom:0}
input[type=radio]{position:absolute;opacity:0;width:1px;height:1px;margin:0}
label,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
label.opt{display:block;margin:7px 0}
label.opt span{display:block;padding:11px 14px;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer}
label.opt b{color:var(--ac);margin-right:8px}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg label span{display:flex;align-items:center;justify-content:center;min-width:46px;height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:600;cursor:pointer}
input[type=radio]:checked+span{background:var(--ac2);border-color:var(--ac);color:#fff}
input[type=radio]:focus-visible+span,input[type=text]:focus,.chip:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input[type=text]{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-bottom:2px solid var(--ac);border-radius:8px;padding:5px 10px;font:inherit;font-size:16px;width:10.5em;max-width:100%;margin:2px 2px}
.exw{border-bottom:2px solid var(--line);padding:0 8px;color:var(--mut)}
.chip{display:inline-block;background:var(--card2);color:var(--ac);border:1px dashed var(--ac);border-radius:9px;padding:1px 10px;min-height:34px;font:inherit;cursor:pointer;vertical-align:baseline;margin:1px 1px;line-height:1.5}
.chip small{font-size:12px;opacity:.8;margin-right:3px;font-weight:700}
.chip.done{border-style:solid;color:var(--tx);background:var(--ac2)}
.chip.ex{cursor:default;border-color:var(--line);color:var(--mut);background:var(--card)}
.ref{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15.5px}
.ref:first-child{border-top:0}
.ref b{color:var(--ac);flex:none;width:1.6em}
.ref div{white-space:pre-line}
.gap{align-items:center}
.sh{position:fixed;top:0;left:0;right:0;bottom:0;display:none;z-index:50;background:rgba(0,0,0,.6);cursor:pointer}
.sh.on{display:flex}
.shi{background:var(--card);width:100%;max-width:780px;margin:auto auto 0;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.shi h4{margin:0 0 8px;color:var(--mut);font-size:14px;font-weight:600}
.shi button{display:block;width:100%;text-align:left;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:7px 0;font:inherit;min-height:48px;cursor:pointer}
.shi button.on{background:var(--ac2);border-color:var(--ac)}
.shi button b{color:var(--ac);margin-right:10px}
.clr{margin-top:30px;background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font:inherit;font-size:15px;cursor:pointer}
label.opt span.ok,.seg label span.ok,.chip.ok{background:#12301f!important;border-color:#4ade80!important;color:#d7f7e2!important}
label.opt span.bad,.seg label span.bad,.chip.bad{background:#3a1717!important;border-color:#f87171!important;color:#fcd9d9!important}
input[type=radio]:disabled+span{cursor:default}
input[type=text].tok{border-color:#4ade80;background:#12301f}
input[type=text].tbad{border-color:#f87171;background:#3a1717}
.fb{margin-top:8px;font-size:15px}.fb.ok{color:#4ade80}.fb.bad{color:#fca5a5}
.chip b{color:#4ade80}
.w{cursor:pointer;border-radius:3px;-webkit-tap-highlight-color:rgba(110,168,254,.25)}
.w.seen{color:#c3b1ff;text-decoration:underline dotted rgba(195,177,255,.55);text-underline-offset:3px}
.w.cur{background:rgba(110,168,254,.3)}
.hint{color:var(--mut);font-size:14px;margin:12px 0 0}
#dict{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
#dict.on{display:block}
#dict .di{max-width:780px;margin:auto;background:var(--card2);border:1px solid var(--ac);border-radius:16px;padding:12px 16px 14px;max-height:48vh;overflow:auto;box-shadow:0 -6px 24px rgba(0,0,0,.5)}
#dict h4{margin:0;font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#dict h4 button{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:20px;line-height:1;flex:none;padding:0}
#dict .sk{font-size:19px;color:#c3b1ff;font-weight:600;margin:4px 0 6px}
#dict .l{color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
#dict .t{margin:0}
#dict .msg{color:var(--mut);margin:6px 0 0}
body.dopen main{padding-bottom:320px}
@media (max-width:480px){body{font-size:16.5px}.q{gap:9px}}

[hidden]{display:none!important}
#home{padding:calc(24px) 16px 40px}
.hm{max-width:520px;margin:0 auto}
.hm h1{font-size:26px;margin:28px 0 22px;text-align:center}
.tl{display:flex;flex-direction:column;gap:12px}
.tb{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:74px;padding:14px 20px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;font:inherit;text-align:left;cursor:pointer}
.tb b{font-size:28px;font-variant-numeric:tabular-nums}
.tb span{color:var(--mut);font-size:15px}
.tb:active{background:var(--ac2);border-color:var(--ac)}
.top{display:flex;align-items:center;gap:10px}
.top .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .cn{flex:none;white-space:nowrap}
#back{flex:none;background:var(--card);color:var(--ac);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:15px;font-weight:600;min-height:38px;cursor:pointer}
</style>
</head>

S.push(["s8","Reading 3",`<h3>Part 3: Earth’s Ants Outweigh All Wild Birds and Mammals (6 points)</h3>
<div class="ins"><p>Read the following text and complete the statements 76–81, with one or two words, based on the information given in the text. The statements do not follow in the same order as the information appears in the text.</p></div>
<div class="txt">`+P(`Ants are a crucial part of nature. Among other roles, ants ventilate the soil, spread seeds, break down organic material, create habitat for other animals and form an essential part of the food chain. Estimating ant numbers and mass provides an important baseline for monitoring ant populations amid worrying environmental changes. There are more than 15,700 named species and subspecies of ants, and many others are not yet named by science. Ants’ high degree of social organization has enabled them to colonize nearly all ecosystems and regions around the globe.

The significant presence of ants has prompted many naturalists to think about their exact number on Earth. But these were educated guesses. Systematic, evidence-based estimates have been lacking. The research done by a Czech institution involved an analysis of 489 studies of ant populations conducted by fellow ant scientists from around the world. This included non-English literature in Spanish, French, German, Russian, Mandarin and Portuguese. Research spanned all continents and significant habitats, including forests, deserts, grasslands and cities. They used standardized methods for collecting and counting ants such as pitfall traps. As you can imagine, this is often boring work.

From all this, they now estimate there are approximately 20 quadrillion ants on Earth. This figure, though conservative, is between two and 20 times higher than previous estimates. The previous figures employed a “top-down” approach by assuming ants comprise about 1 % of the world’s estimated insect population. In contrast, their “bottom-up” estimate is more reliable because it uses data on ants observed directly in the field and makes fewer assumptions.

The next step was to work out how much all these ants weighed. The mass of organisms is typically measured in terms of their carbon makeup. We estimated that 20 quadrillion average-sized ants correspond to a dry weight or “biomass” of approximately 11 million metric tons of carbon. This is more than the combined biomass of wild birds and mammals – about 20 % of total human biomass. Carbon makes up about half the dry weight of an ant. If the weight of other bodily elements was included, the world’s ants’ total mass would still be higher.

It was also found ants are distributed unevenly on Earth’s surface. They vary sixfold between habitats and generally peak in the tropics. This underlines the importance of tropical regions in maintaining healthy ant populations. Ants were particularly abundant in forests and, surprisingly, in dry regions, but they become less common in human-made habitats.

Ants provide vital “ecosystem services” for humans. For instance, a study published August 17, 2022, in the journal Proceedings of the Royal Society B found ants can be more effective than pesticides at helping farmers produce food. They have also developed tight interactions with other organisms — and some species cannot survive without them. For example, some birds rely on ants to flush out their prey. Thousands of plant species feed or house ants in exchange for protection or the spread of their seeds. Many ants are predators, helping to keep populations of other insects in check.

Alarmingly, global insect numbers are declining due to threats such as habitat destruction and fragmentation, chemical use, invasive species and climate change. Data on insect biodiversity is alarmingly scarce. The team hopes their study provides a baseline for further research to help fill this gap. It’s in humanity’s interest to monitor ant populations. Counting ants is not difficult, and citizen scientists worldwide could help investigate how these important animals are faring at a time of great environmental change.`)+`</div>`+

S.push(["s9","Reading 4",`<h3>Part 4: From the Life before Presidency (9 points)</h3>
<div class="ins"><p>Read the following extracts and choose the paragraph (A) – (D) in which you found the information from the statements 82–90. You can use the paragraphs more than once.</p></div>
<div class="txt"><p><b style="color:var(--ac)">(A)</b></p>`+P(`Jimmy Carter, born in rural Georgia to a peanut farmer and businessman father and a mother who was a registered nurse, the future president and humanitarian, grew up in a religious family. Carter attended school in Plains, followed by university study at two Georgia colleges before receiving a Bachelor of Science degree from the United States Naval Academy in 1946. The same year, he married Rosalynn Smith, whom he had known since she was born.

Upon his father’s death in 1953, Carter returned to Georgia to run the family farm and its supply company. He became active in local political life, earning a seat in the Georgia Senate by 1962. He then announced his candidacy for president in 1974.

As governor of Georgia, Carter called for an end to segregation in his inaugural address and increased the number of African Americans on the state government staff. He worked to improve the state’s “wasteful government bureaucracy,” he was pro-environment and wanted more school funding.`)+`<p class="cap">James Earl Carter Jr.</p></div>
<div class="txt"><p><b style="color:var(--ac)">(B)</b></p>`+P(`Richard Nixon was the second of five children born to Frank Nixon, a service station owner and grocer, and Hannah Milhous Nixon. Nixon graduated from Whittier College in California in 1934 and Duke University Law School in Durham, North Carolina, in 1937. Returning to Whittier to practice law, he met Thelma Catherine Ryan, a teacher and amateur actress, after the two were cast in the same play at a local community theatre. The couple married in 1940.

In 1946, he was elected to the U.S. House of Representatives, defeating five-term liberal Democratic Congressman Jerry Voorhis in a campaign that relied heavily on suggestions about Voorhis’s alleged communist sympathies. Running for re-election in 1948, Nixon entered and won both the Democratic and Republican primaries, thus eliminating the need to participate in the general election. As a member of the House Un-American Activities Committee in 1948–50, he took a leading role in investigating Alger Hiss, a former State Department official accused of spying for the Soviet Union. During the committee hearings, Nixon’s hostile questioning of Hiss did much to make his national reputation as an enthusiastic anti-communist.`)+`<p class="cap">Richard Milhous Nixon</p></div>
<div class="txt"><p><b style="color:var(--ac)">(C)</b></p>`+P(`Bill Clinton’s father was a travelling salesman who died in an automobile accident three months before his son was born. His widow, Virginia Dell Blythe, married Roger Clinton, and, despite their unstable union (they divorced and then remarried) and her husband’s alcoholism, her son eventually took his stepfather’s name.

Clinton enrolled at Georgetown University in Washington, D.C., in 1964 and graduated in 1968 with a degree in international affairs. During his freshman and sophomore years, he was elected student president. During his junior and senior years, he worked as an intern for Sen. J. William Fulbright, the Arkansas Democrat who chaired the U.S. Senate Committee on Foreign Relations. Fulbright was a vocal critic of the Vietnam War, and Clinton, like many young men of his generation, also opposed the war.

After graduating from Yale University Law School in 1973, Clinton joined the University of Arkansas School of Law faculty, where he taught until 1976. In 1974 he ran unsuccessfully for a seat in the U.S. House of Representatives. In 1975, he married a fellow Yale Law graduate, attorney Hillary Rodham (Hillary Clinton), who thereafter took an active role in his political career.`)+`<p class="cap">William Jefferson Clinton</p></div>
<div class="txt"><p><b style="color:var(--ac)">(D)</b></p>`+P(`Lyndon Johnson, the first of five children, was born in south-central Texas to Sam Ealy Johnson, Jr. and Rebekah Baines Johnson, a daughter of state legislator Joseph Baines. Sam Johnson had lost money in cotton speculation, and the family often struggled to make a living. After graduating from high school in 1924, Johnson spent three years in odd jobs before enrolling at Southwest Texas State Teachers College in San Marcos. While pursuing his studies there in 1928–29, he took a teaching job at a predominantly Mexican American school in Cotulla, Texas, where the extreme poverty of his students made a profound impression on him.

S.push(["s6","Reading 1",`<h2>SECTION III – READING (30 points)</h2>
<div class="ins"><p>This section of the test has four parts. To complete this section of the test, you will need approximately 70 minutes.</p></div>

<h3>Passage 1: Birmingham (3 points)</h3>
<div class="txt">`+P(`Over three days in September 1768, the first music festival was to help raise funds to complete the new General Hospital on Summer Lane. It proved very popular and successful, but it took another event in 1778 to achieve the required funds. The hospital opened in September 1779.

From September 1784, the performances became a permanent feature and ran every three years, becoming the Birmingham Triennial Musical Festival to raise funds for the hospital.

Originally hosted in St. Philip’s Church (later to become the Cathedral) or the Theatre Royal on New Street, the available venues became too small for the festival. As a result, Birmingham Town Hall was built and opened in 1834 to house it. The festival for 1832 was delayed for two years during its erection.

In 1837 Felix Mendelssohn conducted a performance of his St. Paul oratorio, played the organ, and played the piano part in the premiere of his second Piano Concerto, specially commissioned by the festival. He also appeared at the following festival, playing his first Piano Concerto.

For the 1846 festival, he composed and conducted the premiere of his oratorio Elijah, another new work commissioned by the festival. He was paid 200 guineas. Elijah was played at every successive festival. Mendelssohn died a year later.

The Birmingham Festival Choral Society, which was founded in 1845 to provide the chorus for the festivals and sang at the premiere of Elijah, is still in operation.`)+`</div>`+mcs([

`<h3 style="margin-top:26px">Passage 3: Nordic Music Days (3 points)</h3>
<div class="txt">`+P(`From the mid-19th century, at regular intervals, song festivals were arranged where choirs from all over the North met. The repertoire was decidedly ‘national’ – one could say that when the Nordic countries were gathered, there was a need to express national distinctiveness. But joint activities were arranged too. For example, in 1929, a choir of 1000 sang the Nordic cantata Song of the North, composed jointly by five composers – one from each Nordic country. The song festivals continued well into the first half of the 20th century.

<div class="ins"><p>Read the following extract. Six paragraphs have been removed from the text. Complete the missing paragraphs (A) – (G) into the gaps 70 – 75. There is one extra paragraph which you do not need to use.</p></div>
<div class="txt"><p>The national park of Exmoor, which carpets 267 square miles of Devon and Somerset, is a microcosm of England’s most iconic landscapes: moors covered with heather plants; rolling green hills dotted with sheep; fast-running rivers in deep wooded valleys; and dramatic cliffs plunging to the shoreline.</p></div>`+pk(70,"","ABCDEFG")+

S.push(["s8","Reading 3",`<h3>Part 3: New Evidence Points to a Catastrophic Die-Off of Life on Earth 2 Billion Years Ago (6 points)</h3>
<div class="ins"><p>Read the following text and complete the statements 76–81 with one or two words, based on the information given in the text. The statements do not follow in the same order as the information appears in the text.</p></div>
<div class="txt">`+P(`You’ve probably heard before that Earth has witnessed five mass extinctions. It’s a number taken straight from the fossil record, but that’s not the whole picture, not even close.

Evidence from ancient rocks reveals the oldest die-off in our planet’s history most likely occurred among single-celled organisms more than 2 billion years ago. A recent analysis now suggests that the deadly event was far more significant than any known loss of life that came after, even the dinosaur extinction. “This shows that even when biology on Earth is comprised entirely of microbes, you can still have what could be considered an enormous die-off event that otherwise is not recorded in the fossil record,” says geologist Malcolm Hodgskiss from Stanford University.

Researchers describe this time as a tale of ‘feast and famine’, long before the rise of complex life and far beyond the fossil record. Starting 2.4 billion years ago, oxygen in Earth’s atmosphere was scarce, primarily trapped in minerals or locked up in the water. Then, cyanobacteria arrived on the scene, and these tiny marine microorganisms could photosynthesise, using sunlight to ‘breathe’ oxygen into the air.

The Great Oxidation Event (GOE) was a feasting time as life flourished, diversified, and spread. And then, for some reason, it all came to an abrupt and catastrophic end. To figure out why, scientists at Stanford turned to a mineral called barite, found on the Belcher Islands of subarctic Canada. The landscape here has survived for billions of years, which means it holds a long record of oxygen in our planet’s atmosphere.

Measuring oxygen, sulfur and barium isotopes found in these rocks, the authors found harmful oxygen isotopes occurring shortly after the GOE, some 2.05 billion years ago. This would have required a rapid reduction in the primary production of bacteria, dropping by more than fivefold and potentially by as much as 200 fold. Such a massive collapse, the authors argue, was probably triggered by a lack of critical nutrients, such as phosphorus, which is an essential factor in determining the distribution and development of cyanobacteria.

“A large decrease in nutrients likely brought about this drop supplied to the biosphere that, in turn, marked the conclusion of the GOE and led to the subsequent 1-billion-year interval characterised by markedly low and stable gross primary production compared with the modern Earth,” the authors write.

The findings support the ‘oxygen overshoot’ theory, which suggests that when oxygen-releasing microorganisms first began to flourish in the ocean, they hit a critical peak. Their supply of nutrients could no longer sustain them, leading to a decrease in atmospheric oxygen.

The new data strengthen the idea that a nutrient famine is closely tied to atmospheric oxygen levels. “Some of these oxygen estimates likely require too many microorganisms living in the ocean in Earth’s past,” says geologist Peter Crockford from the Weizmann Institute of Science and Princeton University. “So we can now start to narrow in on what the composition of the atmosphere could have been through this biological angle.”

If the team has it right, the deadly event that struck these microorganisms so long ago would have to be one of the most pronounced biotic changes across all of Earth’s history, even more so than the instances where as many as two-thirds of all plant and animal life disappeared.`)+`</div>`+

S.push(["s9","Reading 4",`<h3>Part 4: Architects (9 points)</h3>
<div class="ins"><p>Read the following extracts and choose the paragraph (A) – (D) in which you found the information from the statements 82–90. You can use the paragraphs more than once.</p></div>
<div class="txt"><p><b style="color:var(--ac)">(A)</b></p>`+P(`Although known today more for his painting and sculpture, Michelangelo was also a master architect. In fact, he was among the first to depart from the classical style and challenge traditional expectations.

In 1523, Pope Clement VII commissioned Michelangelo to design a two-story library on top of an existing convent. Michelangelo employed radical principles in his design of the Laurentian Library in Florence, breaking rules of the classical style. For instance, he took practical elements, like brackets traditionally used as supportive structures, and used them merely for ornamentation.

Michelangelo’s most famous contribution to architecture is probably the dome of St. Peter’s Basilica in Vatican City. It stands as one of the most recognizable landmarks in the world and inspired many imitators, such as the U.S. Capitol in Washington, D.C. However, the dome itself was not completed before Michelangelo died. Scholars still debate how the ultimate construction deviates from Michelangelo’s plans.`)+`<p class="cap">Michelangelo</p></div>
<div class="txt"><p><b style="color:var(--ac)">(B)</b></p>`+P(`Imhotep lived sometime between 2667 B.C.E. and 2648 B.C.E. Although he was born a commoner, Imhotep rose to become chief architect to Pharaoh Djoser of the Third Dynasty of Egypt and is known as the first architect, among other distinctions. Imhotep is credited with designing the Step Pyramid at Saqqara, a pharaoh’s tomb. According to Discovering Egypt, this, the world’s first pyramid, consisted of multiple mastabas (flat-roofed structures with sloping sides that had been the traditional pharaoh burial structures), one stacked atop the next becoming smaller each time. The result is a 62-meter-tall step structure surrounded by a massive complex that overlooked Memphis, the ancient capital. The tomb lies below the pyramid.

John Flamsteed, (born August 19, 1646, Denby, near Derby, Derbyshire, England – died December 31, 1719, Greenwich, London), founder of the Greenwich Observatory, and the first astronomer royal of England.

Poor health forced Flamsteed to leave school in 1662. He studied astronomy on his own and later (1670–74) continued his education at the University of Cambridge. In 1677 he became a member of the Royal Society. Qualifying as a priest in 1675, Flamsteed in 1684 received the income of the living of Burstow, Surrey. His report to the Royal Society on the need for a new observatory resulted in the founding (1675) of the Royal Greenwich Observatory, of which he was the first director (and hence Astronomer Royal). He found that he himself had to supply all the instruments at Greenwich, apart from a few gifts; he was forced to take private pupils to augment his income. There was also a small inheritance from his father, who died in 1688.

S.push(["s8","Reading 3",`<h3>Part 3: Sundrop Farms (6 points)</h3>
<div class="ins"><p>Read the following text and complete the statements 76–81 with one or two words, based on the information given in the text. The statements do not follow in the same order as the information appears in the text.</p></div>
<div class="txt">`+P(`Sundrop Farms is a developer, owner and operator of high tech greenhouse facilities which use a number of technology solutions to grow crops with less dependence on finite natural resources than conventional greenhouse production. Sundrop Farms opened its first pilot facility in Port Augusta, South Australia, in 2010 (operating as Seawater Greenhouse Australia Pty Ltd). This facility was originally designed as a Seawater Greenhouse. However, significant technology changes led to the Sundrop System, and the dissolution of the joint venture with Seawater Greenhouse Ltd. Sundrop Farms commissioned an expanded 20-hectare facility south of Port Augusta in 2016. Sundrop Farms has offices in London, UK and Adelaide, Australia.

The primary inputs to a greenhouse are heat, electricity, water, and nutrients. The Sundrop System is a collection of technologies which, when used in combination, reduce the need for finite resources in these inputs when compared with conventional greenhouse production. In Sundrop Farms’ first facilities in South Australia, these technologies include concentrated solar power, thermal desalination, and steam-driven electricity generation. This is the first combined heat, power, and water system powered by solar energy for greenhouse production.

As of 2015, Sundrop Farms is constructing a 20-hectare solar-powered greenhouse facility near its original site, south of Port Augusta in South Australia. This facility, scheduled for completion in 2016, is expected to produce 15,000 tons of truss tomatoes (on the vine) each year to supply the Australian supermarket operator Coles under a ten-year contract. Sundrop Farms operations will be primarily powered by a new concentrated solar thermal power plant and seawater will be withdrawn from Spencer Gulf and desalinated to feed produce. The project was expected to generate around 100 jobs during the construction of the greenhouse facility (underway as of October 2015) and approximately 200 jobs once operational. In 2014, private equity firm Kohlberg Kravis Roberts invested $100 million in the company. The development has been supported by the Government of South Australia which has provided approximately $6 million in grant funding. A $150 million development contract was awarded to John Holland in 2014 to construct the expanded facility over an 18–24 month time-frame and the total project cost is an estimated $205 million. The $175 million, highly productive “farm” opened in June 2016 and is now producing 10–15 per cent of Australia’s truss tomatoes.

Sundrop Farms’ 20-hectare expanded facility is powered by an Integrated Energy System based on the concentrated solar power (CSP) technology. The system is designed and delivered by Danish renewable energy specialist, Aalborg CSP, and it is the first large-scale CSP-based technology in the world to provide multiple energy streams – heating, fresh water and electricity – for horticultural activities. The 51,500 m2 solar field comprises eSolar’s Solar Collector System. Commissioned in October 2016, the facility’s concentrated solar thermal plant peak heat production rate is 39 MW, and desalinates water while producing 1.5 MW of electricity.

Sundrop Farms’ original pilot facility desalinated seawater but did not return waste brine to Spencer Gulf. The brine was collected in ponds from which salt could be harvested. The company’s brine management plan changed with its 20-hectare expansion in 2014. Sundrop Farms sought and received approval from the South Australian Environment Protection Authority to discharge waste brine into Spencer Gulf at a salinity of 60 parts per thousand. The expanded facility discharged its brine into the cooling water outflow channel at the existing coal-fired Port Augusta power stations. Environmental approval from the Commonwealth Government via referral under the EPBC Act was neither required nor sought by Sundrop Farms for this project. Sundrop Farms continues to investigate commercially effective solutions for the recovery of minerals from brine at a large scale.`)+`</div>`+
[[76,"The construction of the extended greenhouse was supposed to be finished within {76}. <i>(2 words)</i>"],
[77,"The power for Sundrop Farms facility is supplied by a system created by experts from {77}. <i>(1 word)</i>"],

S.push(["s9","Reading 4",`<h3>Part 4: Great Physicists (9 points)</h3>
<div class="ins"><p>Read the following extracts and choose the paragraph (A) – (D) in which you found the information from the statements 82–90. You can use the paragraphs more than once.</p></div>
<div class="txt"><p><b style="color:var(--ac)">(A)</b></p>`+P(`Faraday’s earliest science position was an assistant to Humphry Davy who was also a science enthusiast. Faraday was involved in the analysis of chlorine. He also carried out rough experiments on the diffusion of gases. In addition, he created an early form of what is the now called the Bunsen burner. He worked comprehensively in chemistry; he discovered chemicals like benzene and discovered that chlorine could be turned into a liquid.

He was appointed the first-ever Fullerian Professor in Chemistry in the year 1833. He started to work on electromagnetism, which is what he is best known for, in 1821. He created devices that produced electromagnetic rotations. These developments led to the invention of the electric motor. Ten years later, Michael perceived that passing of current through a copper wire coil that was wrapped around iron caused current to be induced in the adjacent coil. In this way, he invented the very first transformer.`)+`<p class="cap">Michael Faraday</p></div>
<div class="txt"><p><b style="color:var(--ac)">(B)</b></p>`+P(`Even as a student Tesla was inventive. He created a motor that did not need a commutator to function. A commutator is a device that switches the direction of a current in some generators or motors that run on electricity. Tesla invented a motor with coils that were arranged so that when alternating current energized them they cast a magnetic field that rotated at a predetermined speed. Tesla patented this rotating field motor in 1888. Fortunately, he was able to sell it at a time when the advocates of alternating current were in the market for such a motor. Tesla sold his patent to George Westinghouse.

Tesla also made advances with frequency apparatuses and high voltage. He invented the Tesla coil, a system of arc lighting, a generator for high frequency currents, a system for wireless transmission and a high potential magnifying transmitter. The magnifying transmitter was a machine that could produce millions of electrical volts that manifested in long, spectacular arcs. Tesla formed his own company not long after leaving Edison with money from several investors. He held at least 278 patents.`)+`<p class="cap">Nikola Tesla</p></div>
<div class="txt"><p><b style="color:var(--ac)">(C)</b></p>`+P(`Thomson entered Cambridge University in 1841 where he enjoyed an active life as a student. He participated in many activities, but science was his great love. He graduated four years later. He was a Second Wrangler, which was the second highest ranked undergraduate degree in maths. He was also named a fellow of his house and worked in the laboratory of the famous scientist, Henri Regnault, in Paris. At around this same time, the University of Glasgow elevated Thomson to the chair of natural philosophy. He was only 22 years old.

Lord Kelvin invented the mirror galvanometer used in cable signalling and the siphon recorder, which was used to receive the signals. An avid seaman, he invented the first ship’s compass that was free of the magnetic influence of any iron on the ship. He also invented a mechanism that predicted the tide. This was useful to predict the variations in sea level in any port. He suggested that gas thermometers be used for accurate temperature readings, and a thermometer scale is named after him. On the Kelvin thermometer scale, absolute zero is equal to − 273 degrees Celsius. Absolute zero is where molecular movement ceases.`)+`<p class="cap">William Thomson (Lord Kelvin)</p></div>
<div class="txt"><p><b style="color:var(--ac)">(D)</b></p>`+P(`While at the university’s department of physics, Chadwick became acquainted with scientists of the caliber of Hans Geiger and Niels Bohr, among the foremost physicists of their day. He spent his time developing the planetary theory of the atom, and had achieved a Master’s degree by 1913. For his work, he was given the Exhibition Scholarship, which had been set up after the Great Exhibition of 1851.

Chadwick used these funds that this brought to go to study in Germany at the country’s first specialized research institution near Berlin. Here, Geiger was his ultimate superior, an arrangement which suited Chadwick very well. His own research brought advances such as knowledge of the energy range of beta particles, something which Wolfgang Pauli later used to help develop his own theory that the particle, now known as the neutrino, must exist.`)+`<p class="cap">James Chadwick</p></div>
<h3 style="margin-top:24px">Which…</h3>`+
[[82,"physicist also excelled in mathematics?"],
[83,"physicist contributed to a theory of another physicist?"],
[84,"physicist had the copyright for more than 250 inventions?"],

[89,"physicist contributed to an invention of a motor?"],
[90,"physicist’s invention was sold to an interested party?"]].map(a=>pk(a[0],"Which… "+a[1],"ABCD")).join("")+
`<p style="text-align:center;color:var(--mut);margin-top:26px">THE END</p>
<button class="clr" id="clr" type="button">Clear all answers</button>`]);
return S}};

S.push(["s6","Reading 1",`<h2>SECTION III – READING (30 points)</h2>
<div class="ins"><p>This section of the test has four parts. To complete this section of the test, you will need approximately 70 minutes.</p></div>
<h3>Part 1: Monuments of the World (9 points)</h3>

<h3>Passage 1: Petra, Ancient City, Jordan (3 points)</h3>
<div class="txt">`+P(`The city was built on a terrace, pierced from east to west by the Wadi Mūsā (the Valley of Moses) – one of the places where, according to tradition, the Israelite leader Moses struck a rock and water gushed forth.

The Greek name Petra (“Rock”) probably replaced the biblical name Sela. Remains from the Paleolithic and Neolithic periods have been discovered at Petra, and Edomites are known to have occupied the area about 1200 BCE. Centuries later, the Nabataeans, an Arab tribe, occupied it and made it the capital of their kingdom. In 312 BCE, the region was attacked by Seleucid forces, who failed to seize the city. Under Nabataean rule, Petra prospered as a spice trade centre that involved disparate realms such as China, Egypt, Greece, and India, and the city’s population swelled to 10,000, then to 30,000.

When the Romans defeated the Nabataeans in 106 CE, Petra became part of the Roman province of Arabia but continued to flourish until changing trade routes caused its gradual commercial decline. After an earthquake (not the first) damaged the city in 551, significant habitation seems to have ceased. An Islamic invasion occurred in the 7th century, and a Crusader outpost is evidence of activity there in the 12th century. After the Crusades, the city was unknown to the Western world until it was rediscovered by the Swiss traveller Johann Ludwig Burckhardt in 1812.`)+`</div>`+mcs([
[61,"The city of Petra …",["was probably given its name by Edomites","was, according to tradition, founded by Moses","once withstood an enemy’s raid","had a lot of terraces"]],

All of the original religious motifs derived from Hinduism and the temple was dedicated to the gods Shiva, Brahma, and Vishnu. The five central towers of Angkor Wat symbolize the peaks of Mount Meru, which, according to Hindu mythology, is the dwelling place of the gods. The mountain is said to be surrounded by an ocean, and the complex’s enormous moat suggests the oceans at the edge of the world. A 188-metre bridge allows access to the site. The temple is reached by passing through three galleries, each separated by a paved walkway. The temple walls are covered with bas-relief sculptures of very high quality, representing Hindu gods and ancient Khmer scenes, as well as scenes from the Mahabharata and the Ramayana.

After the Cham people of modern-day Vietnam ravaged Angkor in 1177, King Jayavarman VII decided that the Hindu gods had failed him. When he built a new capital nearby, Angkor Thom, he dedicated it to Buddhism. Thereafter, Angkor Wat became a Buddhist shrine, and many of its carvings and statues of Hindu deities were replaced by Buddhist art.`)+`</div>`+mcs([

`<h3 style="margin-top:26px">Passage 3: Taj Mahal, Mausoleum, Agra, India (3 points)</h3>
<div class="txt">`+P(`The Taj Mahal is a mausoleum complex in Agra, western Uttar Pradesh state, northern India. The Taj Mahal was built by the Mughal emperor Shah Jahān (reigned 1628–58) to immortalize his wife Mumtaz Mahal (“Chosen One of the Palace”), who passed away in childbirth in 1631, having been the emperor’s inseparable companion since their marriage in 1612. India’s most famous and widely recognized building, it is situated in the eastern part of the city on the southern (right) bank of the Yamuna (Jumna) River. Agra Fort (Red Fort), also on the right bank of the Yamuna, is about 1.6 km west of the Taj Mahal.

In its harmonious proportions and its fluid incorporation of decorative elements, the Taj Mahal is distinguished as the finest example of Mughal architecture, a blend of Indian, Persian, and Islamic styles. Other attractions include twin mosque buildings (placed symmetrically on either side of the mausoleum), lovely gardens, and a museum. One of the most beautiful structural compositions in the world, the Taj Mahal is also one of the world’s most iconic monuments, visited by millions of tourists each year. The complex was designated a UNESCO World Heritage site in 1983.

During the 1884 excavation of the Temple of Tanis, Petrie discovered fragments of a colossal statue of Ramses II. In 1885 and 1886, at Naukratis and Daphne in the Nile River delta, he uncovered painted pottery by which he proved that those sites had been trading colonies for the ancient Greeks. It was this discovery that caused him to believe that history could be reconstructed by a comparison of potsherds (pottery fragments) at various levels of excavation.

Petrie first applied his principle of sequence dating in Palestine, at the site of Tel Ḥasi, south of Jerusalem. In 1890, in only six weeks, the untiring excavator found a series of occupations for which he could supply approximate habitation dates. Petrie’s work at the hill site marked the second stratigraphic study in archaeological history; the first was carried out at Troy by Heinrich Schliemann. The excavations of these two men marked the beginning of examining successive levels of a site rather than the previously practised method of chaotic digging, which had produced only a jumble of unrelated artefacts.

 KEY=t.KEY||{};ACC=t.ACC||{};ACCM=t.ACCM||{};ACCU=t.ACCU||{};SHOWM=t.SHOWM||{};MULTI=t.MULTI||{};REV={};
 OPT={};for(const k in t.OPT)OPT[k]=t.OPT[k].split("|");
 const S=t.build();
 app.innerHTML=S.map(s=>`<section id="${s[0]}">${s[2]}</section>`).join("");
 $("nav").innerHTML=S.map(s=>`<button type="button" data-s="${s[0]}">${s[1]}</button>`).join("");
 $("ttl").textContent="Maturita "+y+" · English C1";
 document.querySelectorAll("#app [data-k]").forEach(el=>{const v=ans[el.dataset.k];if(v==null)return;if(el.type=="radio")el.checked=(el.value==v);else el.value=v});
 document.querySelectorAll("#app .chip[data-g]").forEach(setChip);
 prog();
 for(let n=1;n<=90;n++)reveal(n);
 closeDict();
 initWords();
 home.hidden=true;hdr.hidden=false;app.hidden=false;window.scrollTo(0,0)}
function goHome(){closeDict();sh.classList.remove("on");app.hidden=true;hdr.hidden=true;home.hidden=false;window.scrollTo(0,0)}
$("tl").innerHTML=Object.keys(TESTS).sort((a,b)=>b-a).map(y=>`<button type="button" class="tb" data-y="${y}"><b>${y}</b><span>${TESTS[y].code}</span></button>`).join("");
$("tl").addEventListener("click",e=>{const b=e.target.closest(".tb");if(b)startTest(b.dataset.y)});
$("back").addEventListener("click",goHome);
$("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)$(b.dataset.s).scrollIntoView({behavior:"smooth",block:"start"})});
app.addEventListener("input",e=>{const t=e.target,k=t.dataset&&t.dataset.k;if(!k||t.type=="radio")return;ans[k]=t.value;save()});
app.addEventListener("change",e=>{const t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;ans[k]=t.value;save();reveal(parseInt(k))});
app.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.type=="text")e.target.blur()});
app.addEventListener("click",e=>{
 const l=e.target.closest("label");
 if(l&&e.target.tagName!="INPUT"){const r=l.querySelector("input[type=radio]");if(r){e.preventDefault();if(r.disabled)return;r.checked=true;ans[r.dataset.k]=r.value;save();reveal(parseInt(r.dataset.k));return}}
 const c=e.target.closest(".chip[data-g]");
 if(c&&!c.classList.contains("done")){cur=c;const n=c.dataset.g;
  shi.innerHTML=`<h4>Gap ${pad(+n)}</h4>`+OPT[n].map((t,i)=>`<button type="button" data-v="${L[i]}" class="${ans[n]==L[i]?"on":""}"><b>${L[i]}</b>${t}</button>`).join("");
  sh.classList.add("on");return}
 const s=e.target.closest(".w");if(s){look(s);return}
 if(e.target.closest("#clr")){const b=$("clr");
  if(!b.dataset.armed){b.dataset.armed=1;b.textContent="Tap again to clear all answers";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Clear all answers"}},4000);return}
  try{localStorage.removeItem(K)}catch(x){}startTest(YR)}});
shi.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!cur)return;ans[cur.dataset.g]=b.dataset.v;setChip(cur);save();sh.classList.remove("on");cur=null});
sh.addEventListener("click",e=>{if(e.target===sh){sh.classList.remove("on");cur=null}});
di.addEventListener("click",e=>{if(e.target.closest("#dx"))closeDict()});
</script>
</body>
</html>
